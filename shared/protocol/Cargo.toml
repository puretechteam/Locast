[package]
name = "locast-protocol"
version = "0.0.0"
description = "Cross-language protocol types shared by the Locast client and server."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs = { version = "12.0.1", features = ["serde-compat", "uuid-impl", "serde-json-impl"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
locast-crypto = { path = "../crypto" }
locast-manifest = { path = "../manifest" }

[dev-dependencies]
serde_json.workspace = true
