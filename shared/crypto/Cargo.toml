[package]
name = "locast-crypto"
version = "0.0.0"
description = "Ed25519 signing, blake3 / SHA-256 hashing, canonical-MessagePack helpers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde.workspace = true
thiserror.workspace = true
blake3 = "1"
sha2 = "0.10"
digest = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rmp-serde = "1"
base64 = "0.22"

[dev-dependencies]
rand = "0.8"
