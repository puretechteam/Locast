# Locast coturn configuration (P9-T02, docs/ARCHITECTURE.md 19.5.2, 21.12).
#
# Deployment-specific and secret values are NOT in this file. The compose
# file passes them on the command line at start-up:
#   --static-auth-secret  from LOCAST_TURN_SHARED_SECRET (shared with the server)
#   --realm               LOCAST_DOMAIN
#   --cert / --pkey       the certificate Caddy issued for LOCAST_DOMAIN
#   --external-ip         LOCAST_TURN_EXTERNAL_IP, when the host is behind NAT

# Listeners: TURN over UDP/TCP and TURN over TLS (`turns:`).
listening-port=3478
tls-listening-port=5349

# Relay port range. The host firewall must allow these UDP ports.
min-port=49160
max-port=49200

# Authentication: time-limited REST credentials (coturn `use-auth-secret`):
# username "<unix_expiry>:<user_id>", password HMAC of the username keyed by
# the shared secret. No static users exist.
use-auth-secret
fingerprint
stale-nonce=600

# TLS: modern protocol versions only.
no-tlsv1
no-tlsv1_1

# Do not let clients relay to the host or private networks (SSRF guard;
# coturn runs with host networking).
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# No telnet admin CLI.
no-cli

# Read the TLS key as root at start-up, then drop to an unprivileged user.
proc-user=nobody
proc-group=nogroup

log-file=stdout
simple-log
