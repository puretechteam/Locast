# Locast CI matrix.
#
# P0-T04 establishes the per-PR build matrix. The matrix is the
# authoritative check for Linux, macOS, and Windows. Per section 26.6 of
# docs/ARCHITECTURE.md, the same checks must pass locally via
# scripts/ci-check.sh / scripts/ci-check.ps1.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref so a new push doesn't queue
# behind a stale run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTUP_MAX_RETRIES: 3

jobs:
  rust-toolchain:
    name: toolchain (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri 2 webkit2gtk-4.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust (stable, rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Cache pnpm store
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (workspace)
        run: cargo test --workspace

      # The tauri-specta bindings auto-regeneration step is intentionally
      # disabled. tauri-specta 2.0.0-rc.25 (a) panics on any i64/u64
      # field by default (mitigated per-field via
      # `#[specta(type = specta_typescript::Number)]` on every IPC
      # payload that uses one) and (b) fails to link on Windows
      # hosts whose bundled `WebView2Loader.dll` is incompatible
      # with the installed Edge WebView2 runtime
      # (`STATUS_ENTRYPOINT_NOT_FOUND`). The bindings file at
      # `apps/client/src/bindings/index.ts` is therefore maintained
      # by hand from the output of:
      #
      #   cargo test -p locast-client --test gen_bindings -- --ignored
      #
      # run on a Linux or macOS host. When a new command or return
      # type is added, regenerate the file, `git diff` the result,
      # and commit. The hand-edited file is checked into CI so the
      # Windows developer workflow does not need the regen tool
      # to compile.
      #
      # Future work (P2+): upgrade tauri-specta to a release that
      # (a) provides a `BigInt::Forbidden` opt-in to suppress the
      # panic and (b) supports a non-Windows-host runnable
      # generator binary, then re-enable the auto-regen step
      # here.
      - name: Regenerate tauri-specta bindings
        if: false
        run: cargo test -p locast-client --test gen_bindings -- --ignored

      - name: Verify generated bindings are up to date
        if: false
        run: git diff --exit-code apps/client/src/bindings/

      - name: Regenerate protocol
        run: cargo test -p locast-protocol -- --ignored

      - name: Verify generated protocol is up to date
        run: git diff --exit-code shared/protocol/ts/

  frontend:
    name: frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22: the client unit tests run TypeScript directly via
      # --experimental-strip-types (22.6+), and ESLint 10 needs 20.19+/22.13+.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm typecheck
        run: pnpm -r typecheck

      # Real ESLint run (apps/client/eslint.config.js), --max-warnings 0.
      - name: pnpm lint
        run: pnpm -r lint

      # Runs every apps/client/src/**/*.smoke.ts via
      # apps/client/scripts/run-unit-tests.mjs; fails if none are found.
      - name: pnpm test
        run: pnpm -r test

  # Browser e2e, part 1 of 2: the hard gate. Runs only the Playwright specs
  # that are green today (apps/client package.json "test:e2e:gate"). Any
  # failure here fails CI. Traces, videos and the HTML report are uploaded
  # when it fails. When a spec in the baseline job below is fixed, add its
  # file to "test:e2e:gate".
  e2e-gate:
    name: e2e gate (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        working-directory: apps/client
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright gate specs
        working-directory: apps/client
        run: pnpm test:e2e:gate

      - name: Summarize gate results
        if: always()
        working-directory: apps/client
        run: pnpm -s test:e2e:summary playwright-report/results.json "e2e gate"

      - name: Upload Playwright report, traces and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-gate-failure
          path: |
            apps/client/playwright-report/
            apps/client/test-results/
          if-no-files-found: warn

  # Browser e2e, part 2 of 2: the full-suite baseline. Runs EVERY spec,
  # including the ones with known failures. It does not gate: the test step is
  # continue-on-error, so the job stays green while the failing step is shown
  # as failed, every failing test is emitted as a warning annotation and listed
  # in the run summary, and a final warning states the outcome. The report,
  # traces and videos are always uploaded. Known failures are inventoried in
  # apps/client/tests/playwright/BASELINE.md.
  e2e-baseline:
    name: e2e full-suite baseline (non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        working-directory: apps/client
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright full suite
        id: e2e
        continue-on-error: true
        working-directory: apps/client
        run: pnpm test:e2e

      - name: Summarize baseline
        if: always()
        working-directory: apps/client
        run: pnpm -s test:e2e:summary playwright-report/results.json "e2e full-suite baseline"

      - name: State the baseline outcome
        if: steps.e2e.outcome == 'failure'
        run: echo "::warning title=e2e baseline::The full Playwright suite has failing tests. This job is non-gating; see the run summary and apps/client/tests/playwright/BASELINE.md."

      - name: Upload Playwright report, traces and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-baseline
          path: |
            apps/client/playwright-report/
            apps/client/test-results/
          if-no-files-found: warn

  # P8-T04: supply-chain gates (docs/ARCHITECTURE.md section 21.13).
  # cargo-deny checks advisories, licenses, bans, and sources per deny.toml.
  # pnpm audit fails the build on high or critical production advisories.
  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: pnpm audit (production, high and above)
        run: pnpm audit --prod --audit-level=high

  # P8-T08: hardening checklist (docs/ARCHITECTURE.md section 21.17).
  # Builds the real server image and asserts: the binary is compiled with
  # the hardening RUSTFLAGS (statically linked), the container runs as a
  # non-root user, compose sets cgroup limits, and the no-`unsafe` lint is
  # on. `needs: supply-chain` makes a clean cargo-deny a precondition.
  hardening:
    name: hardening checklist
    runs-on: ubuntu-latest
    needs: supply-chain
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static checklist (Dockerfile, compose, lints, CI)
        run: bash scripts/check-hardening.sh static

      - name: Build the server image
        run: docker build -f apps/server/Dockerfile -t locast-server:hardening .

      - name: Image checklist (non-root, static binary, starts)
        run: bash scripts/check-hardening.sh image locast-server:hardening

  # P9-T02: bring up deploy/docker-compose.prod.yml (Caddy + server + coturn)
  # with a *.localhost test domain (Caddy's local CA, no public DNS) and check
  # HTTPS, the /ws WebSocket upgrade, /turn, and coturn STUN/TLS. A real
  # public domain and Let's Encrypt issuance cannot be tested here.
  deploy-smoke:
    name: deploy smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Production compose smoke test
        run: bash scripts/deploy-smoke.sh

  # P8-T06: criterion hot-path benches (ARCHITECTURE 28.10) compared against
  # the checked-in per-platform baseline in
  # apps/client/src-tauri/benches/baseline/. Only Linux is gated: absolute
  # timings are only comparable to a baseline recorded on the same class of
  # machine. Until linux.json exists the job records results and uploads them
  # as an artifact so a baseline can be committed from a real runner.
  perf:
    name: perf (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri 2 webkit2gtk-4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Perf gate (fails on regression vs baseline)
        if: hashFiles('apps/client/src-tauri/benches/baseline/linux.json') != ''
        run: bash scripts/check-perf.sh --out perf-results.json

      - name: Perf record (no baseline for this platform yet)
        if: hashFiles('apps/client/src-tauri/benches/baseline/linux.json') == ''
        run: bash scripts/check-perf.sh --allow-missing-baseline --out perf-results.json

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: perf-results.json
          if-no-files-found: ignore

  # P8-T07: webview performance trace (ARCHITECTURE 28.11). Plays a looping
  # video for 60 s while sustaining 120 Hz pen input for 5 minutes, captures a
  # Playwright trace and a Chromium DevTools timeline trace, uploads them, and
  # flags every Long Task above 50 ms. Long tasks are reported as warnings, not
  # failures: the architecture says to investigate them, and the harness runs an
  # unminified Vite dev build on a shared runner.
  webview-perf:
    name: webview perf trace (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        working-directory: apps/client
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture trace (60 s playback, 5 min drawing)
        working-directory: apps/client
        run: pnpm test:perf

      - name: Flag long tasks (> 50 ms)
        if: always()
        working-directory: apps/client
        run: pnpm perf:flag

      - name: Upload trace artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webview-perf-trace
          path: apps/client/perf-results/
          if-no-files-found: warn

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [rust-toolchain, frontend]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri 2 webkit2gtk-4.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: cargo build (workspace)
        run: cargo build --workspace

      - name: pnpm build (client)
        working-directory: apps/client
        run: pnpm build
