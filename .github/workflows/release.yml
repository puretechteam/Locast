# Locast release workflow (P9-T01).
#
# A pushed `v<semver>` tag builds the installers on each OS, signs them,
# verifies the signatures, and uploads them to a DRAFT GitHub release:
#
#   Windows  MSI          signed (Authenticode, Tauri certificateThumbprint)
#   macOS    DMG          signed (Developer ID) and notarized + stapled
#   Linux    .deb, .AppImage   (the roadmap does not require Linux signing)
#
# Signing is fail-closed: a signed run with missing credentials stops in the
# preflight job, and a signature that does not verify fails its build job,
# so no unsigned installer can reach a release.
#
# P9-T03: every run also produces, next to the installers,
#   locast-client.sbom.json     CycloneDX 1.5 SBOM of the client (Rust crate
#                               graph for all targets; bundled JS deps are a
#                               known gap, see apps/client/scripts/sbom.sh)
#   locast-server.sbom.json     CycloneDX 1.5 SBOM of the server crate
#   locast-client.intoto.jsonl  SLSA provenance (slsa-github-generator), one
#                               signed in-toto statement whose subjects are
#                               every installer and both SBOMs
# The SBOMs are schema-validated with cyclonedx-cli and the provenance is
# verified with slsa-verifier; either failing stops the run.
#
# A manual run (workflow_dispatch) with `unsigned_check` builds clearly
# labeled UNSIGNED installers as workflow artifacts to validate packaging
# without credentials. It never creates a release.
#
# Required repository secrets for signed runs (values are never printed):
#   WINDOWS_CERTIFICATE           base64 of the code-signing .pfx
#   WINDOWS_CERTIFICATE_PASSWORD  password of that .pfx
#   APPLE_CERTIFICATE             base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD    password of that .p12
#   APPLE_SIGNING_IDENTITY        e.g. "Developer ID Application: <name> (<team>)"
#   APPLE_ID                      Apple ID used for notarization
#   APPLE_PASSWORD                app-specific password for that Apple ID
#   APPLE_TEAM_ID                 Apple Developer team id
#
# Per AGENTS.md, only this workflow's trigger should produce a release tag;
# do not tag locally without explicit user instruction.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      unsigned_check:
        description: "Build UNSIGNED installers for validation only (no release is created)"
        type: boolean
        default: false

# A release is intentionally never cancelled by a newer push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # "true" for tag pushes and for manual runs that did not ask for an
  # unsigned check.
  SIGNED: ${{ github.event_name == 'push' || !inputs.unsigned_check }}

jobs:
  preflight:
    name: signing preflight
    runs-on: ubuntu-latest
    steps:
      - name: Require signing credentials
        if: env.SIGNED == 'true'
        env:
          # Booleans only: these expressions never expose a secret value.
          HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
          HAS_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
        run: |
          missing=""
          for name in WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD \
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            flag="HAS_${name}"
            if [ "${!flag}" != "true" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::Signed release builds require these repository secrets, which are not set:${missing}. Add them under Settings > Secrets and variables > Actions, or run the workflow manually with unsigned_check to validate packaging only."
            exit 1
          fi
          echo "All signing secrets are present."

      - name: Unsigned check notice
        if: env.SIGNED != 'true'
        run: echo "::warning::UNSIGNED validation build. Installers are NOT signed or notarized and no release will be created."

  build:
    name: installers (${{ matrix.platform }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
          - platform: linux
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri 2 bundling)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # ---- Windows: MSI, signed via Tauri's certificateThumbprint ----
      - name: Import Windows code-signing certificate
        if: matrix.platform == 'windows' && env.SIGNED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw |
              Where-Object { $_.HasPrivateKey } | Select-Object -First 1
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
          if (-not $cert) { throw 'The Windows signing certificate has no private key.' }
          # The thumbprint identifies the certificate; it is not secret.
          $cfgPath = Join-Path $env:RUNNER_TEMP 'tauri.windows-signing.json'
          @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint } } } |
            ConvertTo-Json -Depth 4 | Set-Content -Path $cfgPath -Encoding utf8
          "TAURI_WINDOWS_SIGNING_CONFIG=$cfgPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Windows MSI (signed)
        if: matrix.platform == 'windows' && env.SIGNED == 'true'
        working-directory: apps/client
        shell: pwsh
        run: pnpm tauri build --bundles msi --config "$env:TAURI_WINDOWS_SIGNING_CONFIG"

      - name: Verify Windows signatures
        if: matrix.platform == 'windows' && env.SIGNED == 'true'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem target/release/bundle/msi/*.msi) + @(Get-Item target/release/locast-client.exe)
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature -FilePath $f.FullName
            if ($sig.Status -ne 'Valid') { throw "$($f.Name): signature status is '$($sig.Status)', expected Valid." }
            if (-not $sig.TimeStamperCertificate) { throw "$($f.Name): signature is not timestamped." }
            Write-Host "$($f.Name): Valid, signed by '$($sig.SignerCertificate.Subject)', timestamped by '$($sig.TimeStamperCertificate.Subject)'"
          }

      # ---- macOS: DMG, signed (Developer ID) and notarized ----
      - name: Build macOS DMG (signed + notarized app)
        if: matrix.platform == 'macos' && env.SIGNED == 'true'
        working-directory: apps/client
        env:
          # Tauri imports the certificate into a temporary keychain, signs
          # the app and the DMG with the hardened runtime, and notarizes and
          # staples the app.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri build --bundles dmg

      - name: Notarize and staple the DMG
        if: matrix.platform == 'macos' && env.SIGNED == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for dmg in target/release/bundle/dmg/*.dmg; do
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait --timeout 30m
            xcrun stapler staple "$dmg"
          done

      - name: Verify macOS signatures and notarization
        if: matrix.platform == 'macos' && env.SIGNED == 'true'
        run: |
          set -euo pipefail
          for dmg in target/release/bundle/dmg/*.dmg; do
            codesign --verify --strict --verbose=2 "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
            mnt="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
            app="$(find "$mnt" -maxdepth 1 -name '*.app' -print -quit)"
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
            hdiutil detach "$mnt"
          done

      # ---- Linux: .deb and .AppImage (no signing required) ----
      - name: Build Linux packages
        if: matrix.platform == 'linux'
        working-directory: apps/client
        run: pnpm tauri build --bundles deb,appimage

      # ---- Unsigned validation builds (manual unsigned_check only) ----
      - name: Build UNSIGNED installer (validation only)
        if: matrix.platform != 'linux' && env.SIGNED != 'true'
        working-directory: apps/client
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            pnpm tauri build --bundles msi
          else
            pnpm tauri build --bundles dmg
          fi

      - name: Collect installers (fail if a required format is missing)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p installers
          case "${{ matrix.platform }}" in
            windows) patterns=("target/release/bundle/msi/*.msi") ;;
            macos) patterns=("target/release/bundle/dmg/*.dmg") ;;
            linux) patterns=("target/release/bundle/deb/*.deb" "target/release/bundle/appimage/*.AppImage") ;;
          esac
          for pattern in "${patterns[@]}"; do
            files=( $pattern )
            if [ "${#files[@]}" -eq 0 ]; then
              echo "::error::No installer matched ${pattern}"
              exit 1
            fi
            cp "${files[@]}" installers/
          done
          ls -l installers

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SIGNED == 'true' && 'installers' || 'UNSIGNED-installers' }}-${{ matrix.platform }}
          path: installers/*
          if-no-files-found: error

  # ---- P9-T03: CycloneDX SBOMs ----
  sbom:
    name: SBOM (CycloneDX)
    needs: preflight
    runs-on: ubuntu-latest
    env:
      CARGO_CYCLONEDX_VERSION: 0.5.9
      CYCLONEDX_CLI_VERSION: v0.33.1
      CYCLONEDX_CLI_SHA256: bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-cyclonedx (pinned)
        run: cargo install cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION" --locked

      - name: Install cyclonedx-cli (pinned, sha256-verified)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl --fail --silent --show-error --location -o "$bin/cyclonedx" \
            "https://github.com/CycloneDX/cyclonedx-cli/releases/download/${CYCLONEDX_CLI_VERSION}/cyclonedx-linux-x64"
          echo "${CYCLONEDX_CLI_SHA256}  $bin/cyclonedx" | sha256sum --check --strict
          chmod +x "$bin/cyclonedx"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Generate and validate SBOMs
        run: |
          bash apps/client/scripts/sbom.sh sbom-out
          bash apps/server/scripts/sbom.sh sbom-out
          ls -l sbom-out

      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom-out/*.sbom.json
          if-no-files-found: error

  # ---- P9-T03: SLSA provenance ----
  hashes:
    name: provenance subjects
    needs: [build, sbom]
    runs-on: ubuntu-latest
    outputs:
      subjects: ${{ steps.hash.outputs.subjects }}
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.SIGNED == 'true' && 'installers-*' || 'UNSIGNED-installers-*' }}
          path: subjects
          merge-multiple: true

      - name: Download SBOMs
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: subjects

      - name: Hash every release file
        id: hash
        working-directory: subjects
        run: |
          set -euo pipefail
          sha256sum -- * | tee /dev/stderr > ../subjects.sha256
          echo "subjects=$(base64 -w0 ../subjects.sha256)" >> "$GITHUB_OUTPUT"

  # The official SLSA generator (Build L3 isolation): signs an in-toto
  # statement with a SLSA provenance predicate, keyless via Sigstore and the
  # workflow's OIDC identity. Reusable workflows must be pinned by tag.
  provenance:
    needs: hashes
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.hashes.outputs.subjects }}
      provenance-name: locast-client.intoto.jsonl
      upload-assets: false

  verify-provenance:
    name: verify provenance
    needs: [hashes, provenance]
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.SIGNED == 'true' && 'installers-*' || 'UNSIGNED-installers-*' }}
          path: dist
          merge-multiple: true

      - name: Download SBOMs
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: dist

      - name: Download provenance
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: dist

      - name: Install slsa-verifier (pinned)
        uses: slsa-framework/slsa-verifier/actions/installer@v2.7.1

      - name: Verify the provenance for every release file
        working-directory: dist
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then ref=(--source-tag "$REF_NAME"); else ref=(--source-branch "$REF_NAME"); fi
          for f in *; do
            [ "$f" = locast-client.intoto.jsonl ] && continue
            slsa-verifier verify-artifact "$f" \
              --provenance-path locast-client.intoto.jsonl \
              --source-uri "github.com/${GITHUB_REPOSITORY}" "${ref[@]}"
          done

  release:
    name: draft GitHub release
    needs: [build, sbom, provenance, verify-provenance]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      - name: Download SBOMs
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: dist

      - name: Download provenance
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: dist

      - name: Check every required release file is present
        run: |
          set -euo pipefail
          shopt -s nullglob
          for ext in msi dmg deb AppImage; do
            files=( dist/*."$ext" )
            if [ "${#files[@]}" -eq 0 ]; then
              echo "::error::Missing .${ext} installer; refusing to create a partial release."
              exit 1
            fi
          done
          for f in locast-client.sbom.json locast-server.sbom.json locast-client.intoto.jsonl; do
            if [ ! -s "dist/$f" ]; then
              echo "::error::Missing ${f}; refusing to create a release without SBOM and provenance."
              exit 1
            fi
          done
          ls -l dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "Locast $TAG" --generate-notes
