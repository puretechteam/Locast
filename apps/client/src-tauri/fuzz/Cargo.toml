[package]
name = "locast-client-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rmp-serde = "1"
# Drives the async `validate_library_path` in path_validator.
tokio = { version = "1", features = ["rt"] }
# Parses the untrusted manifest JSON in manifest_verify.
serde_json = "1"

[dependencies.locast-client]
path = ".."

# Drives the manifest_verify target. Same path crate that
# `locast-client` already depends on, so no new lockfile package.
[dependencies.locast-manifest]
path = "../../../../shared/manifest"

# Keep the fuzz targets out of `cargo test` and `cargo doc` of
# this workspace; each target is a `[[bin]]` with the standard
# cargo-fuzz scaffolding below.
[[bin]]
name = "wire_decode"
path = "fuzz_targets/wire_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "path_validator"
path = "fuzz_targets/path_validator.rs"
test = false
doc = false
bench = false

[[bin]]
name = "subtitle_srt"
path = "fuzz_targets/subtitle_srt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "subtitle_vtt"
path = "fuzz_targets/subtitle_vtt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "subtitle_ass"
path = "fuzz_targets/subtitle_ass.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transfer_frame"
path = "fuzz_targets/transfer_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_verify"
path = "fuzz_targets/manifest_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_url"
path = "fuzz_targets/protocol_url.rs"
test = false
doc = false
bench = false

[workspace]

# `build-override` applies only to host artifacts (build scripts
# and proc macros), not to the fuzzed code. cargo-fuzz builds the
# target with `-Cdebug-assertions`, but that RUSTFLAG does not reach
# host artifacts. tauri-utils gates `ResolvedCommand::referenced_by`
# on `cfg(debug_assertions)`, so without this the host-side
# `generate_context!` codegen and the target-side struct would
# disagree on `cfg(debug_assertions)` and fail with E0063. This
# setting only aligns that cfg between host and target; it does not
# control overflow checks or debug assertions in the fuzzed code.
[profile.release.build-override]
debug-assertions = true
