[package]
name = "locast-client"
version = "0.0.0"
description = "Locast desktop client (Tauri 2 + React)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "locast_client_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "locast-client"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
log = "0.4"
locast-crypto.workspace = true
sha2 = "0.10"
digest = "0.10"
hex = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
unicode-normalization = "0.1"
dirs = "5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync", "process", "time"] }
specta = { version = "2.0.0-rc", features = ["derive", "function"] }
tauri-specta = { version = "2.0.0-rc", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
rand = { version = "0.8", features = ["small_rng"] }
base64 = "0.22"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
async-trait = "0.1"
locast-protocol = { path = "../../../shared/protocol" }
locast-manifest = { path = "../../../shared/manifest" }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
rmp-serde = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
keyring-core = "0.6"
blake3 = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"
tokio-tungstenite = "0.24"
rmp-serde = "1"
futures-util = "0.3"
locast-server = { path = "../../../apps/server" }
axum = { version = "0.7", features = ["ws", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
